<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Nunito,sans-serif;background:#F2F1EC;color:#22302A}
.hd{padding:56px 20px 8px;display:flex;align-items:center;gap:12px}
.hd img{width:48px;height:48px;object-fit:contain}
.hd h1{font-size:22px;font-weight:800}
.hd p{font-size:13px;color:#56635B}
.c{background:#fff;border-radius:24px;margin:12px 16px 0;padding:18px}
.c span{font-size:13px;color:#56635B}
.c h2{font-size:34px;font-weight:800;margin:4px 0}
.chip{display:inline-block;background:#E4EEE7;color:#2E6B4F;font-weight:700;font-size:13px;padding:6px 12px;border-radius:14px}
.two{display:flex;gap:12px;margin:12px 16px 0}
.two .c{margin:0;flex:1;padding:14px}
.two h3{font-size:18px;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:12px}
.bars div{flex:1;background:#A8BFA3;border-radius:10px 10px 4px 4px}
.bars div.on{background:#2E6B4F}
.lab{display:flex;gap:10px;font-size:11px;color:#56635B;margin-top:6px}
.lab span{flex:1;text-align:center}
.btn{margin:16px 16px 0;background:#2E6B4F;color:#fff;font-weight:800;text-align:center;padding:16px;border-radius:18px;font-size:16px}
.tab{position:absolute;bottom:0;left:0;right:0;height:82px;background:#fff;display:flex;justify-content:space-around;padding-top:16px;font-size:12px;font-weight:700;color:#56635B;border-radius:24px 24px 0 0}
.tab .on{color:#2E6B4F}
</style></head><body>
<div class="hd"><img src="../../../mobile/assets/brand/monedin.png" alt=""><div><h1>¡Hola, Laura!</h1><p>Así va tu noviembre</p></div></div>
<div class="c"><span>Flujo neto del mes</span><h2>$ 1.245.000</h2><div class="chip">▲ 18 % frente a octubre</div></div>
<div class="two"><div class="c"><span>Ingresos</span><h3>$ 3.200.000</h3></div><div class="c"><span>Gastos</span><h3>$ 1.955.000</h3></div></div>
<div class="c"><span>Gasto por categoría</span>
 <div class="bars"><div class="on" style="height:90%"></div><div style="height:46%"></div><div style="height:32%"></div><div style="height:20%"></div></div>
 <div class="lab"><span>Comida</span><span>Transporte</span><span>Servicios</span><span>Otros</span></div></div>
<div class="btn">Registrar movimiento</div>
<div class="tab"><span class="on">Inicio</span><span>Movimientos</span><span>Metas</span><span>Perfil</span></div>
</body></html>
